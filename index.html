<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japan Population Pyramid 1950-2100</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 50%, #2d2d44 100%);
            color: #ffffff;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            font-weight: 400;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            font-weight: 700;
            text-shadow: 0 4px 8px rgba(0,0,0,0.3);
            letter-spacing: -0.5px;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        input[type="range"] {
            width: 200px;
            height: 6px;
            background: #ddd;
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: #4CAF50;
            cursor: pointer;
            border-radius: 50%;
        }

        .year-display {
            font-size: 1.5em;
            font-weight: bold;
            min-width: 80px;
            text-align: center;
        }

        button {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button:hover {
            background: linear-gradient(135deg, #45a049 0%, #3d8b40 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(76, 175, 80, 0.4);
        }

        button:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(76, 175, 80, 0.2);
        }

        button:disabled {
            background: linear-gradient(135deg, #666 0%, #555 100%);
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .pyramid-chart {
            width: 100%;
            height: 600px;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
        }

        .bar {
            transition: all 0.25s ease-in-out;
        }
        
        .bar:hover {
            opacity: 0.8;
        }

        .male-bar {
            fill: #3498db;
        }

        .female-bar {
            fill: #ff69b4;
        }

        .center-line {
            stroke: #ffffff;
            stroke-width: 2;
            stroke-dasharray: 5,5;
        }

        .age-label {
            fill: #ffffff;
            font-size: 12px;
            text-anchor: middle;
            alignment-baseline: middle;
        }

        .axis-label {
            fill: #ffffff;
            font-size: 14px;
            font-weight: bold;
        }

        .highlight-rect {
            fill: #ffeb3b;
            opacity: 0.3;
        }

        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
            font-size: 12px;
            z-index: 1000;
        }

        .stats-display {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.08);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            min-width: 160px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
        }
        
        .stat-item:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
        }

        .stat-value {
            font-size: 2em;
            font-weight: 700;
            margin-bottom: 8px;
            color: #4CAF50;
            text-shadow: 0 2px 4px rgba(76, 175, 80, 0.3);
        }

        .stat-label {
            font-size: 0.95em;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .units-label {
            font-size: 0.8em;
            opacity: 0.7;
            margin-top: 5px;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Japan Population Pyramid 1950-2100</h1>
        
        <div class="stats-display">
            <div class="stat-item">
                <div class="stat-value" id="totalPopulation">--</div>
                <div class="stat-label">Total Population</div>
                <div class="units-label">thousands</div>

            <div class="stat-item">
                <div class="stat-value" id="growthRate">--</div>
                <div class="stat-label">Annual Growth</div>
            </div>
            <div class="stat-item">

            </div>
            <div class="stat-item">
                <div class="stat-value" id="supportRatio">--</div>
                <div class="stat-label">Support Ratio</div>
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <div class="slider-container">
                    <label>Year:</label>
                    <input type="range" id="yearSlider" min="1950" max="2090" value="1950" step="1">

                </div>
            </div>
            <div class="control-group">
                <button id="playButton">▶ Play</button>
                <button id="resetButton">↺ Reset</button>
                <button id="compareButton">⚖ Compare</button>
                <button id="highlightButton">✏ Highlight Age</button>
                <button id="populationViewBtn" style="background: #4CAF50;">👥 Population</button>
                <button id="dependencyViewBtn" style="background: #666;">📊 Dependency</button>
            </div>
        </div>

        <div class="chart-container" id="populationChartContainer">
            <svg class="pyramid-chart" id="pyramidChart"></svg>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color male-bar"></div>
                    <span>Male</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color female-bar"></div>
                    <span>Female</span>
                </div>
            </div>
        </div>

        <div class="chart-container" id="dependencyChartContainer" style="display: none;">
            <svg class="pyramid-chart" id="dependencyChart"></svg>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color" style="background: #ff6b6b;"></div>
                    <span>Total Dependency</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #4ecdc4;"></div>
                    <span>Child Dependency</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #45b7d1;"></div>
                    <span>Old-Age Dependency</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #f7b731;"></div>
                    <span>Support Ratio</span>
                </div>
            </div>
        </div>
    </div>

    <div class="tooltip" id="tooltip" style="display: none;"></div>

            2091: { male: [1500,1600,1670,1720,1880,1920,1930,2000,2100,2200,2150,2100,2050,2100,2350,2500,2400,1950,1250,550,150], female: [1430,1520,1600,1650,1830,1900,1910,2000,2100,2200,2150,2100,2050,2100,2400,2650,2700,2650,2400,1950,1200,500] },

            2097: { male: [1380,1480,1550,1600,1700,1740,1810,1820,1800,1900,1850,1800,1750,1800,2050,2200,2100,1650,950,370,90], female: [1310,1340,1480,1470,1590,1720,1730,1820,1920,1900,1850,1750,1700,1700,1800,2300,2250,2050,1800,1350,900,380] },
            2098: { male: [1360,1460,1530,1580,1670,1710,1790,1790,1750,1850,1800,1750,1700,1750,2000,2150,2050,1600,900,340,80], female: [1290,1310,1460,1440,1550,1690,1700,1790,1890,1850,1800,1700,1650,1650,1700,2250,2200,1950,1700,1250,850,360] },
            2099: { male: [1340,1440,1510,1560,1640,1680,1770,1760,1700,1800,1750,1700,1650,1700,1950,2100,2000,1550,850,310,70], female: [1270,1280,1440,1410,1510,1660,1670,1760,1860,1800,1750,1650,1600,1600,1600,2200,2150,1850,1600,1150,800,340] },
            2100: { male: [1320,1420,1490,1540,1610,1650,1750,1730,1650,1750,1700,1650,1600,1650,1900,2050,1950,1500,800,280,60], female: [1250,1250,1420,1380,1470,1630,1640,1730,1830,1750,1700,1600,1550,1550,1500,2100,2050,1750,1500,1050,750,320] }
        };

        // Generate intermediate years (only up to 2090)
        for (let year = 1951; year <= 2090; year++) {
            if (!populationData[year]) {
                const prevYear = Math.floor(year / 10) * 10;
                const nextYear = Math.ceil(year / 10) * 10;
                const ratio = (year - prevYear) / (nextYear - prevYear);
                
                populationData[year] = {
                    male: populationData[prevYear].male.map((val, i) => 
                        Math.round(val + (populationData[nextYear].male[i] - val) * ratio)
                    ),
                    female: populationData[prevYear].female.map((val, i) => 
                        Math.round(val + (populationData[nextYear].female[i] - val) * ratio)
                    )
                };
            }
        }

        // Dependency ratio data (only up to 2090, since 2100 data doesn't exist)
        const dependencyData = {};
        for (let year = 1950; year <= 2090; year++) {
            const data = populationData[year];
            const totalPop = data.male.reduce((a, b) => a + b, 0) + data.female.reduce((a, b) => a + b, 0);
            const workingAge = data.male.slice(5, 15).reduce((a, b) => a + b, 0) + data.female.slice(5, 15).reduce((a, b) => a + b, 0);
            const youngAge = data.male.slice(0, 5).reduce((a, b) => a + b, 0) + data.female.slice(0, 5).reduce((a, b) => a + b, 0);
            const oldAge = data.male.slice(15).reduce((a, b) => a + b, 0) + data.female.slice(15).reduce((a, b) => a + b, 0);
            
            dependencyData[year] = {
                total: ((youngAge + oldAge) / workingAge * 100),
                child: (youngAge / workingAge * 100),
                oldAge: (oldAge / workingAge * 100),
                support: (workingAge / oldAge)
            };
        }

        // Global variables
        let currentYear = 1950;
        let isPlaying = false;
        let playInterval;
        let isComparison = false;
        let highlightMode = false;
        let highlightedAge = null;
        let currentView = 'population';

        // Age groups
        const ageGroups = ['0-4', '5-9', '10-14', '15-19', '20-24', '25-29', '30-34', '35-39', '40-44', '45-49', '50-54', '55-59', '60-64', '65-69', '70-74', '75-79', '80-84', '85-89', '90-94', '95-99', '100+'];

        // Chart dimensions
        const margin = { top: 40, right: 40, bottom: 60, left: 40 };
        const width = 1000 - margin.left - margin.right;
        const height = 600 - margin.top - margin.bottom;

        // Create SVG
        const svg = d3.select("#pyramidChart")
            .attr("width", width + margin.left + margin.right)
            .attr("height", height + margin.top + margin.bottom)
            .append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        // Y scale for age groups (0-4 at bottom, 100+ at top)
        const yScale = d3.scaleBand()
            .domain(ageGroups.slice().reverse()) // Reverse so 0-4 is at bottom
            .range([height, 0]) // Reverse range so 0-4 maps to bottom
            .padding(0.1);

        // Tooltip
        const tooltip = d3.select("#tooltip");

        // Update chart
        function updateChart(year, svgElement = svg) {
            const data = populationData[year];
            
            // Clear previous chart
            svgElement.selectAll("*").remove();
            
            // FIXED width calculation - no dynamic scaling
            const maxLimit = 6500;
            const halfWidth = width / 2;
            
            // Simple linear scaling: value/6500 * halfWidth
            const scaleValue = (value) => (value / maxLimit) * halfWidth;
            
            // Add center line
            svgElement.append("line")
                .attr("x1", halfWidth)
                .attr("x2", halfWidth)
                .attr("y1", 0)
                .attr("y2", height)
                .attr("class", "center-line");

            // Add age labels (0-4 at bottom, 100+ at top)
            svgElement.selectAll(".age-label")
                .data(ageGroups.slice().reverse())
                .enter()
                .append("text")
                .attr("class", "age-label")
                .attr("x", halfWidth)
                .attr("y", (d, i) => yScale(d) + yScale.bandwidth()/2)
                .text(d => d);

            // Add year indicator
            svgElement.append("text")
                .attr("x", halfWidth)
                .attr("y", -15)
                .attr("text-anchor", "middle")
                .attr("class", "axis-label")
                .style("font-size", "18px")
                .style("fill", "#ffeb3b")
                .text(year);

            // Male bars (left) - FIXED positioning
            svgElement.selectAll(".male-bar")
                .data(data.male)
                .enter()
                .filter(d => d > 0)
                .append("rect")
                .attr("class", "bar male-bar")
                .attr("x", d => halfWidth - scaleValue(d)) // Start from scaled position
                .attr("y", (d, i) => yScale(ageGroups.slice().reverse()[i])) // 0-4 at bottom
                .attr("width", d => scaleValue(d)) // Width = scaled value
                .attr("height", yScale.bandwidth())
                .on("mouseover", function(event, d) {
                    const i = data.male.indexOf(d);
                    tooltip.style("display", "block")
                        .html(`Year: ${year}<br>Age: ${ageGroups[i]}<br>Male: ${d.toLocaleString()}`)
                        .style("left", (event.pageX + 10) + "px")
                        .style("top", (event.pageY - 28) + "px");
                })
                .on("mouseout", function() {
                    tooltip.style("display", "none");
                });

            // Female bars (right) - FIXED positioning
            svgElement.selectAll(".female-bar")
                .data(data.female)
                .enter()
                .filter(d => d > 0)
                .append("rect")
                .attr("class", "bar female-bar")
                .attr("x", halfWidth) // ALWAYS start from center
                .attr("y", (d, i) => yScale(ageGroups.slice().reverse()[i])) // 0-4 at bottom
                .attr("width", d => scaleValue(d)) // Width = scaled value
                .attr("height", yScale.bandwidth())
                .on("mouseover", function(event, d) {
                    const i = data.female.indexOf(d);
                    tooltip.style("display", "block")
                        .html(`Year: ${year}<br>Age: ${ageGroups[i]}<br>Female: ${d.toLocaleString()}`)
                        .style("left", (event.pageX + 10) + "px")
                        .style("top", (event.pageY - 28) + "px");
                })
                .on("mouseout", function() {
                    tooltip.style("display", "none");
                });

            // Add highlighting if active
            if (highlightMode && highlightedAge !== null) {
                svgElement.append("rect")
                    .attr("class", "highlight-rect")
                    .attr("x", 0)
                    .attr("y", yScale(ageGroups.slice().reverse()[highlightedAge]))
                    .attr("width", width)
                    .attr("height", yScale.bandwidth());
            }
        }

        // Calculate growth rate
        function calculateGrowthRate(year) {
            if (year === 1950) return 0;
            const prevYear = year - 1;
            const currentPop = populationData[year].male.reduce((a, b) => a + b, 0) + populationData[year].female.reduce((a, b) => a + b, 0);
            const prevPop = populationData[prevYear].male.reduce((a, b) => a + b, 0) + populationData[prevYear].female.reduce((a, b) => a + b, 0);
            return ((currentPop - prevPop) / prevPop * 100).toFixed(2);
        }

        // Update stats with color coding
        function updateStats(year) {
            const data = populationData[year];
            const totalPop = data.male.reduce((a, b) => a + b, 0) + data.female.reduce((a, b) => a + b, 0);
            const growthRate = calculateGrowthRate(year);
            const depData = dependencyData[year];

            // Color coding for values
            const growthColor = growthRate < -1 ? '#ff6b6b' : (growthRate < 0 ? '#ffa726' : '#4CAF50');
            const depColor = depData.total > 60 ? '#ff6b6b' : (depData.total > 40 ? '#ffa726' : '#4CAF50');
            const supportColor = depData.support < 3 ? '#ff6b6b' : (depData.support < 5 ? '#ffa726' : '#4CAF50');

            document.getElementById("totalPopulation").textContent = totalPop.toLocaleString();
            document.getElementById("growthRate").textContent = growthRate + "%";
            document.getElementById("growthRate").style.color = growthColor;
            document.getElementById("dependencyRatio").textContent = depData.total.toFixed(1) + "%";
            document.getElementById("dependencyRatio").style.color = depColor;
            document.getElementById("supportRatio").textContent = depData.support.toFixed(1);
            document.getElementById("supportRatio").style.color = supportColor;
        }

        // Create dependency ratio chart (keeping your existing working version)
        function createDependencyChart() {
            const depSvg = d3.select("#dependencyChart");
            const years = Object.keys(dependencyData).map(Number);
            
            // Clear previous chart
            depSvg.selectAll("*").remove();
            
            // Set up dimensions
            const depMargin = { top: 40, right: 40, bottom: 60, left: 80 };
            const depWidth = 1000 - depMargin.left - depMargin.right;
            const depHeight = 600 - depMargin.top - depMargin.bottom;
            
            depSvg.attr("width", depWidth + depMargin.left + depMargin.right)
                .attr("height", depHeight + depMargin.top + depMargin.bottom);
            
            const g = depSvg.append("g").attr("transform", `translate(${depMargin.left},${depMargin.top})`);
            
            // Scales
            const xScale = d3.scaleLinear()
                .domain([1950, 2090]) // Limit to 2090 since data doesn't exist beyond
                .range([0, depWidth]);
            
            const yScaleTotal = d3.scaleLinear()
                .domain([0, 150]) // Extend Y-axis to show all dependency ratios
                .range([depHeight, 0]);
            
            const yScaleSupport = d3.scaleLinear()
                .domain([0, 15]) // Keep support ratio scale
                .range([depHeight, 0]);
            
            // Create line generators
            const lineTotal = d3.line()
                .x(d => xScale(d.year))
                .y(d => yScaleTotal(d.total))
                .curve(d3.curveMonotoneX);
            
            const lineChild = d3.line()
                .x(d => xScale(d.year))
                .y(d => yScaleTotal(d.child))
                .curve(d3.curveMonotoneX);
            
            const lineOldAge = d3.line()
                .x(d => xScale(d.year))
                .y(d => yScaleTotal(d.oldAge))
                .curve(d3.curveMonotoneX);
            
            const lineSupport = d3.line()
                .x(d => xScale(d.year))
                .y(d => yScaleSupport(d.support))
                .curve(d3.curveMonotoneX);
            
            // Prepare data
            const depDataArray = years.map(year => ({
                year: year,
                total: dependencyData[year].total,
                child: dependencyData[year].child,
                oldAge: dependencyData[year].oldAge,
                support: dependencyData[year].support
            }));
            
            // Add grid lines
            g.append("g")
                .attr("class", "grid")
                .attr("transform", `translate(0,${depHeight})`)
                .call(d3.axisBottom(xScale)
                    .tickSize(-depHeight)
                    .tickFormat("")
                )
                .style("stroke-dasharray", "3,3")
                .style("opacity", 0.3);
            
            g.append("g")
                .attr("class", "grid")
                .call(d3.axisLeft(yScaleTotal)
                    .tickSize(-depWidth)
                    .tickFormat("")
                )
                .style("stroke-dasharray", "3,3")
                .style("opacity", 0.3);
            
            // Add axes
            g.append("g")
                .attr("transform", `translate(0,${depHeight})`)
                .call(d3.axisBottom(xScale).tickFormat(d3.format("d")))
                .style("color", "#ffffff");
            
            g.append("g")
                .call(d3.axisLeft(yScaleTotal))
                .style("color", "#ffffff");
            
            // Add Y axis label
            g.append("text")
                .attr("transform", "rotate(-90)")
                .attr("y", 0 - depMargin.left)
                .attr("x", 0 - (depHeight / 2))
                .attr("dy", "1em")
                .style("text-anchor", "middle")
                .style("fill", "#ffffff")
                .text("Dependency Ratio (%)");
            
            // Add lines
            g.append("path")
                .datum(depDataArray)
                .attr("fill", "none")
                .attr("stroke", "#ff6b6b")
                .attr("stroke-width", 3)
                .attr("d", lineTotal);
            
            g.append("path")
                .datum(depDataArray)
                .attr("fill", "none")
                .attr("stroke", "#4ecdc4")
                .attr("stroke-width", 3)
                .attr("d", lineChild);
            
            g.append("path")
                .datum(depDataArray)
                .attr("fill", "none")
                .attr("stroke", "#45b7d1")
                .attr("stroke-width", 3)
                .attr("d", lineOldAge);
            
            g.append("path")
                .datum(depDataArray)
                .attr("fill", "none")
                .attr("stroke", "#f7b731")
                .attr("stroke-width", 3)
                .attr("d", lineSupport);
            
            // Add current year indicator at top
            const currentIndicator = g.append("line")
                .attr("x1", xScale(currentYear))
                .attr("y1", 0)
                .attr("x2", xScale(currentYear))
                .attr("y2", depHeight)
                .attr("stroke", "#ffeb3b")
                .attr("stroke-width", 3)
                .attr("stroke-dasharray", "5,5");
                
            // Add year text at top
            g.append("text")
                .attr("x", xScale(currentYear))
                .attr("y", -15)
                .attr("text-anchor", "middle")
                .attr("fill", "#ffeb3b")
                .attr("font-size", "16px")
                .attr("font-weight", "bold")
                .text(currentYear);
                
            // Add horizontal reference bar at 2026
            g.append("line")
                .attr("x1", xScale(2026))
                .attr("y1", yScaleTotal(dependencyData[2026].total))
                .attr("x2", xScale(2050)) // Extend to 2050 for visibility
                .attr("y2", yScaleTotal(dependencyData[2026].total))
                .attr("stroke", "#808080") // Grey color
                .attr("stroke-width", 3)
                .attr("opacity", 0.8);
                
            // Add hover area for tooltips and click interactions
            const hoverArea = g.append("rect")
                .attr("x", 0)
                .attr("y", 0)
                .attr("width", depWidth)
                .attr("height", depHeight)
                .attr("fill", "transparent")
                .on("mousemove", function(event) {
                    const [mouseX] = d3.pointer(event, this);
                    const year = Math.round(xScale.invert(mouseX));
                    if (year >= 1950 && year <= 2090) {
                        const data = dependencyData[year];
                        const totalColor = data.total > 60 ? '#ff6b6b' : (data.total > 40 ? '#ffa726' : '#4CAF50');
                        const childColor = data.child > 40 ? '#ff6b6b' : (data.child > 25 ? '#ffa726' : '#4CAF50');
                        const oldAgeColor = data.oldAge > 40 ? '#ff6b6b' : (data.oldAge > 25 ? '#ffa726' : '#4CAF50');
                        const supportColor = data.support < 3 ? '#ff6b6b' : (data.support < 5 ? '#ffa726' : '#4CAF50');
                        
                        tooltip.style("display", "block")
                            .html(`
                                <div style="font-weight: bold; margin-bottom: 5px;">Year: ${year}</div>
                                <div style="color: ${totalColor};">Total Dependency: <strong>${data.total.toFixed(1)}%</strong></div>
                                <div style="color: ${childColor};">Child Dependency: <strong>${data.child.toFixed(1)}%</strong></div>
                                <div style="color: ${oldAgeColor};">Old-Age Dependency: <strong>${data.oldAge.toFixed(1)}%</strong></div>
                                <div style="color: ${supportColor};">Support Ratio: <strong>${data.support.toFixed(1)}</strong></div>
                            `)
                            .style("left", (event.pageX + 10) + "px")
                            .style("top", (event.pageY - 28) + "px");
                    }
                })
                .on("mouseout", function() {
                    tooltip.style("display", "none");
                })
                .on("click", function(event) {
                    const [mouseX] = d3.pointer(event, this);
                    const year = Math.round(xScale.invert(mouseX));
                    if (year >= 1950 && year <= 2090) {
                        // Remove previous click lines
                        g.selectAll(".click-line").remove();
                        
                        // Add vertical lines for all 4 indicators
                        const data = dependencyData[year];
                        
                        // Total dependency line
                        g.append("line")
                            .attr("class", "click-line")
                            .attr("x1", xScale(year))
                            .attr("y1", yScaleTotal(data.total))
                            .attr("x2", xScale(year))
                            .attr("y2", yScaleTotal(0))
                            .attr("stroke", "#ff6b6b")
                            .attr("stroke-width", 2)
                            .attr("opacity", 0.8);
                            
                        // Child dependency line
                        g.append("line")
                            .attr("class", "click-line")
                            .attr("x1", xScale(year))
                            .attr("y1", yScaleTotal(data.child))
                            .attr("x2", xScale(year))
                            .attr("y2", yScaleTotal(0))
                            .attr("stroke", "#4ecdc4")
                            .attr("stroke-width", 2)
                            .attr("opacity", 0.8);
                            
                        // Old-age dependency line
                        g.append("line")
                            .attr("class", "click-line")
                            .attr("x1", xScale(year))
                            .attr("y1", yScaleTotal(data.oldAge))
                            .attr("x2", xScale(year))
                            .attr("y2", yScaleTotal(0))
                            .attr("stroke", "#45b7d1")
                            .attr("stroke-width", 2)
                            .attr("opacity", 0.8);
                            
                        // Support ratio line (using different scale)
                        g.append("line")
                            .attr("class", "click-line")
                            .attr("x1", xScale(year))
                            .attr("y1", yScaleSupport(data.support))
                            .attr("x2", xScale(year))
                            .attr("y2", yScaleSupport(0))
                            .attr("stroke", "#f7b731")
                            .attr("stroke-width", 2)
                            .attr("opacity", 0.8);
                            
                        // Update current year indicator
                        currentIndicator
                            .attr("x1", xScale(year))
                            .attr("x2", xScale(year));
                        g.select("text")
                            .attr("x", xScale(year))
                            .text(year);
                        
                        // Update global current year
                        currentYear = year;
                        document.getElementById("yearSlider").value = year;
                        document.getElementById("yearDisplay").textContent = year;
                        updateStats(year);
                    }
                });
        }

        // Toggle view
        function toggleView(view) {
            currentView = view;
            if (view === 'population') {
                document.getElementById("populationChartContainer").style.display = "block";
                document.getElementById("dependencyChartContainer").style.display = "none";
                document.getElementById("populationViewBtn").style.background = "#4CAF50";
                document.getElementById("dependencyViewBtn").style.background = "#666";
                updateChart(currentYear);
            } else {
                document.getElementById("populationChartContainer").style.display = "none";
                document.getElementById("dependencyChartContainer").style.display = "block";
                document.getElementById("populationViewBtn").style.background = "#666";
                document.getElementById("dependencyViewBtn").style.background = "#4CAF50";
                createDependencyChart();
            }
        }

        // Toggle age highlighting
        function toggleAgeHighlight(ageIndex) {
            if (highlightedAge === ageIndex) {
                highlightedAge = null;
            } else {
                highlightedAge = ageIndex;
            }
            updateChart(currentYear);
        }

        // Event listeners
        document.getElementById("yearSlider").addEventListener("input", function(e) {
            currentYear = parseInt(e.target.value);
            document.getElementById("yearDisplay").textContent = currentYear;
            updateChart(currentYear);
            updateStats(currentYear);
            if (currentView === 'dependency') {
                createDependencyChart();
            }
        });

        document.getElementById("playButton").addEventListener("click", function() {
            if (isPlaying) {
                clearInterval(playInterval);
                this.textContent = "▶ Play";
                isPlaying = false;
            } else {
                this.textContent = "⏸ Pause";
                isPlaying = true;
                playInterval = setInterval(() => {
                    if (currentYear >= 2100) {
                        currentYear = 1950;
                    } else {
                        currentYear++;
                    }
                    document.getElementById("yearSlider").value = currentYear;
                    document.getElementById("yearDisplay").textContent = currentYear;
                    updateChart(currentYear);
                    updateStats(currentYear);
                    if (currentView === 'dependency') {
                        createDependencyChart();
                    }
                }, 250); // 0.25 seconds for very smooth animation
            }
        });

        document.getElementById("resetButton").addEventListener("click", function() {
            clearInterval(playInterval);
            isPlaying = false;
            document.getElementById("playButton").textContent = "▶ Play";
            currentYear = 1950;
            document.getElementById("yearSlider").value = 1950;
            document.getElementById("yearDisplay").textContent = 1950;
            updateChart(currentYear);
            updateStats(currentYear);
            if (currentView === 'dependency') {
                createDependencyChart();
            }
        });

        document.getElementById("compareButton").addEventListener("click", function() {
            // This would implement comparison mode
            alert("Comparison mode would show two charts side by side");
        });

        document.getElementById("highlightButton").addEventListener("click", function() {
            highlightMode = !highlightMode;
            this.style.background = highlightMode ? "#ffeb3b" : "#4CAF50";
            this.style.color = highlightMode ? "#000" : "#fff";
            if (!highlightMode) {
                highlightedAge = null;
                updateChart(currentYear);
            }
        });

        document.getElementById("populationViewBtn").addEventListener("click", function() {
            toggleView('population');
        });

        document.getElementById("dependencyViewBtn").addEventListener("click", function() {
            toggleView('dependency');
        });

        // Keyboard shortcuts
        document.addEventListener("keydown", function(e) {
            if (e.key === 'ArrowLeft' && currentYear > 1950) {
                currentYear--;
                document.getElementById("yearSlider").value = currentYear;
                document.getElementById("yearDisplay").textContent = currentYear;
                updateChart(currentYear);
                updateStats(currentYear);
                if (currentView === 'dependency') {
                    createDependencyChart();
                }
            } else if (e.key === 'ArrowRight' && currentYear < 2090) {
                currentYear++;
                document.getElementById("yearSlider").value = currentYear;
                document.getElementById("yearDisplay").textContent = currentYear;
                updateChart(currentYear);
                updateStats(currentYear);
                if (currentView === 'dependency') {
                    createDependencyChart();
                }
            } else if (e.key === ' ') {
                e.preventDefault();
                document.getElementById('playButton').click();
            } else if (e.key === 'c' || e.key === 'C') {
                document.getElementById('compareButton').click();
            } else if (e.key === 'h' || e.key === 'H') {
                document.getElementById('highlightButton').click();
            } else if (e.key === 'v' || e.key === 'V') {
                toggleView(currentView === 'population' ? 'dependency' : 'population');
            }
        });

        // Initialize chart and stats
        updateChart(currentYear);
        updateStats(currentYear);
    </script>
</body>
</html>
